name: Aggiorna lista

on:
  schedule:
    - cron: '17 3 * * *'   # ogni notte alle 03:17 UTC (05:17 ora italiana estiva)
  workflow_dispatch:        # avvio manuale dalla scheda Actions

permissions:
  contents: write

concurrency:
  group: aggiorna-lista
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rigenera la playlist
        shell: powershell
        # i server di GitHub sono fuori dall'Italia: i flussi geobloccati vengono tenuti senza verificarli
        run: .\genera_lista.ps1 -TieniGeo

      - name: Pubblica se cambiata
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add lista_italia.m3u
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Nessuna modifica alla lista.'; exit 0 }
          git commit -m "Aggiornamento automatico lista ($(Get-Date -Format 'yyyy-MM-dd'))"
          git push
