name: Aggiorna lista

on:
  schedule:
    - cron: '17 3 * * *'   # ogni notte alle 03:17 UTC (04:17 ora italiana solare, 05:17 legale)
  workflow_dispatch:        # avvio manuale dalla scheda Actions

permissions:
  contents: write

concurrency:
  group: aggiorna-lista
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  aggiorna:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Recupera lo stato dei flussi
        shell: powershell
        # stato.json (ultima data in cui ogni flusso ha risposto) vive nella release "dati"
        run: |
          gh release download dati --pattern stato.json --clobber
          if ($LASTEXITCODE -ne 0) { Write-Host 'Nessuno stato precedente: si parte da zero.' }
          exit 0

      - name: Rigenera playlist, guida e rapporto
        shell: powershell
        # i server di GitHub sono fuori dall'Italia: i flussi geobloccati vengono tenuti senza verificarli
        run: .\genera_lista.ps1 -TieniGeo

      - name: Pubblica guida e stato nella release
        shell: powershell
        run: |
          gh release view dati *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create dati --title 'Dati generati' --notes 'Guida EPG (guida.xml.gz) e stato dei flussi (stato.json), aggiornati ogni notte dal workflow.' --latest=false
          }
          gh release upload dati guida.xml.gz stato.json --clobber
          exit $LASTEXITCODE

      - name: Pubblica le playlist se cambiate
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add lista_italia.m3u lista_nazionali.m3u STATO.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Nessuna modifica.'; exit 0 }
          git commit -m "Aggiornamento automatico lista ($(Get-Date -Format 'yyyy-MM-dd'))"
          git push
